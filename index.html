/* Düzen: tek sütun "oyun masası"; üstte bahçe sayacı, ortada büyük oyun kartı, altta ailenin büyüyen bahçesi */
:root {
  --bg: #EEF5EC;
  --surface: #FFFFFF;
  --surface-2: #F6FAF4;
  --ink: #1D2A24;
  --muted: #5A6B62;
  --line: #D5E3D6;
  --leaf: #2C8656;
  --on-leaf: #FFFFFF;
  --sun: #E89A0C;
  --sky: #2F6FC9;
  --berry: #C93A6E;
  --plum: #7448BF;
  --ok: #2C8656;
  --bad: #C2453A;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1915; --surface: #17251F; --surface-2: #1D2E27; --ink: #E8F1EC; --muted: #9EB2A8; --line: #2A3D35;
    --leaf: #5CC48D; --on-leaf: #0E1915; --sun: #FFC24D; --sky: #77A9F2; --berry: #F27EA7; --plum: #AE90EE;
    --ok: #5CC48D; --bad: #F08A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1915; --surface: #17251F; --surface-2: #1D2E27; --ink: #E8F1EC; --muted: #9EB2A8; --line: #2A3D35;
  --leaf: #5CC48D; --on-leaf: #0E1915; --sun: #FFC24D; --sky: #77A9F2; --berry: #F27EA7; --plum: #AE90EE;
  --ok: #5CC48D; --bad: #F08A80; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
.shell { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 2.3rem; font-weight: 800; }
h2 { font-size: 1.7rem; font-weight: 800; }
h3 { font-size: 1.2rem; font-weight: 600; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

/* Üst bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; color: var(--leaf); letter-spacing: -0.01em; background: none; border: 0; padding: 0; }
.logo span { color: var(--sun); }
.top-right { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; font-variant-numeric: tabular-nums; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; }

/* Kart */
.card { background: var(--surface); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 60, 40, .35); }
.card.game { border-top: 8px solid var(--c, var(--leaf)); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.badge { align-self: flex-start; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px; border-radius: 999px; font-weight: 800; font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; background: color-mix(in srgb, var(--c, var(--leaf)) 16%, var(--surface)); color: var(--ink); }
.turnline { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--leaf); }
.dots i.now { background: var(--sun); transform: scale(1.3); }

/* Butonlar */
.btn { border: 0; border-radius: 16px; padding: 14px 20px; font-weight: 800; font-size: 1.05rem; background: var(--leaf); color: var(--on-leaf); min-height: 52px; transition: transform .08s ease; }
.btn:active { transform: scale(.97); }
.btn.big { font-size: 1.25rem; padding: 18px 22px; min-height: 64px; width: 100%; font-family: var(--font-display); }
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn.warn { background: var(--sun); color: #1D2A24; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; font-weight: 700; }

/* Ana sayfa */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 8px 2px; }
.hero h1 em { font-style: normal; color: var(--leaf); }
.lead { font-size: 1.1rem; color: var(--muted); max-width: 32em; }
.steps { display: grid; gap: 10px; counter-reset: s; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: color-mix(in srgb, var(--sun) 28%, var(--surface)); }
details summary { cursor: pointer; font-weight: 800; }

/* Kurulum */
.stepper { display: flex; align-items: center; gap: 14px; }
.stepper b { font-family: var(--font-display); font-size: 2rem; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); font-size: 1.5rem; font-weight: 800; }
.player-row { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 16px; background: var(--surface-2); }
.player-row .fields { display: grid; grid-template-columns: 1fr 120px; gap: 8px; min-width: 0; }
.avatar-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px dashed var(--line); background: var(--surface); font-size: 1.7rem; }
.player-row input, .player-row select { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-height: 46px; }
@media (max-width: 380px) { .player-row .fields { grid-template-columns: 1fr; } }

/* Tema */
.theme-card { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 18px; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; }
.theme-card .ico { font-size: 2.2rem; width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.theme-card:hover { border-color: var(--c); }

/* Sıra ekranı */
.handoff { align-items: center; text-align: center; padding-block: 34px; }
.handoff .face { font-size: 5rem; line-height: 1; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }

/* Oyun içeriği */
.secret-word { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; text-align: center; padding: 18px; border-radius: 18px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); }
.secret-word .em { display: block; font-size: 3.4rem; }
.question { font-size: 1.35rem; font-weight: 800; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 14px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface-2); font-weight: 700; font-size: 1.08rem; min-height: 56px; display: flex; gap: 12px; align-items: center; }
.opt .em { font-size: 1.8rem; }
.opts.pics { grid-template-columns: repeat(3, 1fr); }
.opts.pics .opt { flex-direction: column; text-align: center; justify-content: center; gap: 4px; font-size: .95rem; }
.opts.pics .opt .em { font-size: 2.6rem; }
.opt.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.note { padding: 14px 16px; border-radius: 16px; background: color-mix(in srgb, var(--sun) 14%, var(--surface)); border-left: 5px solid var(--sun); }
.note b { display: block; margin-bottom: 2px; }
.rule { font-size: .92rem; color: var(--muted); }
.timer { --p: 1; width: 132px; height: 132px; border-radius: 50%; margin: 4px auto; display: grid; place-items: center; background: conic-gradient(var(--c, var(--leaf)) calc(var(--p) * 360deg), var(--line) 0); }
.timer b { width: 104px; height: 104px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-size: 2.6rem; font-variant-numeric: tabular-nums; }
.timer.low b { color: var(--bad); }
.counter { width: 100%; padding: 22px; border-radius: 22px; border: 0; background: var(--c); color: var(--on-leaf); font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; }
.counter b { display: block; font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 10px 14px; font-weight: 800; min-height: 46px; }
.list { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
blockquote { margin: 0; padding: 16px 18px; border-radius: 18px; background: var(--surface-2); font-size: 1.1rem; }
blockquote cite { display: block; margin-top: 6px; font-style: normal; color: var(--muted); font-size: .88rem; font-weight: 700; }

/* Bahçe */
.garden { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.garden-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.garden-plants { display: flex; flex-wrap: wrap; gap: 2px; font-size: 1.5rem; min-height: 36px; align-items: flex-end; }
.garden-plants .new { animation: sprout .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes sprout { from { transform: scale(0) translateY(10px); } to { transform: none; } }
.garden-ground { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--sun) 40%, var(--leaf)); opacity: .5; }

.float { position: fixed; left: 50%; top: 45%; font-family: var(--font-display); font-size: 2.2rem; font-weight: 800; color: var(--leaf); pointer-events: none; animation: up 1.1s ease-out forwards; z-index: 20; }
@keyframes up { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.1); } to { transform: translate(-50%, -110px); opacity: 0; } }
.confetti { position: fixed; top: -40px; font-size: 1.6rem; pointer-events: none; z-index: 19; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
.foot { text-align: center; font-size: .82rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .float, .confetti { display: none; }
}
</style>

/* Türkçe ekler: ünlü uyumu ve ünsüz benzeşmesi (Zeynep'te, Ömer'e, Anne'nin) */
function lastVowel(w) { const m = w.toLocaleLowerCase("tr").match(/[aeıioöuü](?=[^aeıioöuü]*$)/); return m ? m[0] : "e"; }
const endsVowel = w => /[aeıioöuü]$/i.test(w.toLocaleLowerCase("tr"));
function ek(name, type) {
  const v = lastVowel(name), back = "aıou".includes(v), n = String(name);
  if (type === "de") { const hard = /[fstkçşhp]$/.test(n.toLocaleLowerCase("tr")); return n + "'" + (hard ? "t" : "d") + (back ? "a" : "e"); }
  if (type === "e") return n + "'" + (endsVowel(n) ? "y" : "") + (back ? "a" : "e");
  const four = { a: "ı", ı: "ı", e: "i", i: "i", o: "u", u: "u", ö: "ü", ü: "ü" }[v] || "i";
  return n + "'" + (endsVowel(n) ? "n" : "") + four + "n";
}
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function pick(pool, key) {
  const used = G.used[key] || (G.used[key] = new Set());
  let avail = pool.filter(x => !used.has(x));
  if (!avail.length) { used.clear(); avail = pool; }
  const x = rnd(avail); used.add(x); return x;
}

let ac = null;
function tone(f, d, type = "sine", when = 0) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}

function startGame(themeKey) {
  const players = family.map(p => ({ ...p }));
  const n = players.length;
  const total = Math.max(6, Math.min(12, n * 2 + 2));
  const plan = []; let p = 0;
  for (let t = 0; t < total; t++) {
    if ((t + 1) % 4 === 0) plan.push({ group: true });
    else plan.push({ player: players[p++ % n] });
  }
  G = { theme: themeKey, players, plan, i: 0, fidan: 0, used: {}, lastType: null, saskinCount: 0 };
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  screenHandoff();
}

function chooseType(player) {
  const adult = player.age === "y";
  const hasKid = G.players.some(p => p.age !== "y");
  if (adult && hasKid && G.lastType !== "saskin" && G.saskinCount < 2 && Math.random() < 0.4) return "saskin";
  const opts = ["pandomim", "bilgi", "senolsan"].filter(t => t !== G.lastType);
  return rnd(opts);
}

function header(type) {
  const g = GAMES[type];
  const dots = G.plan.map((_, i) => `<i class="${i < G.i ? "on" : i === G.i ? "now" : ""}"></i>`).join("");
  return `<div class="turnline"><span class="badge">${g.ico} ${g.name}</span><div class="dots" aria-label="Tur ${G.i + 1} / ${G.plan.length}">${dots}</div></div>`;
}
const card = (type, inner) => `<section class="card game" style="--c:var(${GAMES[type].color})">${header(type)}${inner}</section>
  <div class="row" style="justify-content:center"><button class="link" data-act="finish">Oyunu bitir ve sohbete geç</button></div>`;

function screenHandoff() {
  const t = G.plan[G.i];
  if (t.group) {
    t.type = "hizli";
    render(card("hizli", `
      <div class="stack handoff">
        <div class="face">🙌</div>
        <h2>Herkes katılıyor!</h2>
        <p class="muted">Telefonu ortaya koyun. 30 saniyeniz var, hep birlikte bağırarak sayacaksınız.</p>
        <button class="btn big" data-act="play">Hazırız!</button>
      </div>`));
    return;
  }
  t.type = t.type || chooseType(t.player);
  const p = t.player;
  const secret = t.type === "pandomim" || t.type === "saskin";
  render(card(t.type, `
    <div class="stack handoff">
      <div class="face">${p.av}</div>
      <h2>Sıra ${esc(ek(p.name, "de"))}!</h2>
      <p class="muted">${secret ? `Telefonu ${esc(ek(p.name, "e"))} verin. <b>Diğerleri bakmasın!</b> 🤫` : `Telefonu ${esc(ek(p.name, "e"))} verin.`}${ageOf(p.age).lvl === 0 ? " Kartı bir büyük okusun." : ""}</p>
      <button class="btn big" data-act="play">Hazırım!</button>
    </div>`));
}

function play() {
  const t = G.plan[G.i];
  G.lastType = t.type;
  ({ pandomim: playPandomim, bilgi: playBilgi, senolsan: playSenOlsan, hizli: playHizli, saskin: playSaskin })[t.type](t);
}

function nextTurn() {
  G.i++;
  if (G.i >= G.plan.length) screenDeep(); else screenHandoff();
}

function runTimer(sec, onEnd) {
  const el = document.getElementById("timer"); let left = sec;
  const draw = () => { if (!el) return; el.style.setProperty("--p", left / sec); el.querySelector("b").textContent = left; el.classList.toggle("low", left <= 5); };
  draw(); clearInterval(timerId);
  timerId = setInterval(() => {
    left--; draw();
    if (left <= 5 && left > 0) sfx.tick();
    if (left <= 0) { clearInterval(timerId); timerId = null; sfx.end(); onEnd && onEnd(); }
  }, 1000);
}

/* Kıssa Pandomimi */
function playPandomim(t) {
  const lvl = ageOf(t.player.age).lvl;
  const pool = lvl === 0 ? PANDOMIM.filter(x => x.kolay) : PANDOMIM;
  const x = pick(pool, "pan");
  render(card("pandomim", `
    <p class="muted">Sadece <b>${esc(t.player.name)}</b> baksın! Bunu canlandır:</p>
    <div class="secret-word"><span class="em">${x.e}</span>${esc(x.w)}</div>
    <p class="rule">Konuşmak yasak, ses çıkarmak serbest! Peygamberler ve sahabeler canlandırılmaz; sadece hayvanlar, nesneler ve davranışlar.</p>
    <div id="pan-stage" class="stack">
      <button class="btn big" data-act="pan-go">Gizle ve süreyi başlat (60 sn)</button>
    </div>`));
  G.cur = x;
}
function panGo() {
  document.querySelector(".secret-word").innerHTML = `<span class="em">🤫</span>Canlandır!`;
  document.getElementById("pan-stage").innerHTML = `
    <div class="timer" id="timer"><b>60</b></div>
    <div class="btn-row">
      <button class="btn" data-act="pan-done" data-arg="1">Bildiler! 🎉</button>
      <button class="btn ghost" data-act="pan-done" data-arg="0">Bilemediler</button>
    </div>`;
  runTimer(60, () => { const s = document.querySelector(".secret-word"); if (s) s.innerHTML = `<span class="em">⏰</span>Süre bitti!`; });
}
function panDone(ok) {
  clearInterval(timerId);
  const x = G.cur;
  if (ok) { grow(1); confetti(); } else sfx.no();
  document.querySelector(".secret-word").innerHTML = `<span class="em">${x.e}</span>${esc(x.w)}`;
  document.getElementById("pan-stage").innerHTML = `
    <div class="note"><b>Kıssayı biliyor musunuz?</b>${esc(x.info)}</div>
    <button class="btn big" data-act="next">Devam</button>`;
}

/* Bil Bakalım */
function playBilgi(t) {
  const lvl = ageOf(t.player.age).lvl;
  const x = pick(BILGI[lvl], "bil" + lvl);
  const pics = lvl === 0;
  const opts = shuffle(x.o.map((o, i) => ({ o, ok: i === 0 })));
  G.cur = { x, opts };
  render(card("bilgi", `
    <p class="muted">${esc(t.player.name)} için ${ageOf(t.player.age).label} sorusu</p>
    <p class="question">${esc(x.q)}</p>
    <div class="opts ${pics ? "pics" : ""}" id="opts">
      ${opts.map((it, i) => pics
        ? `<button class="opt" data-act="answer" data-arg="${i}"><span class="em">${it.o[1]}</span>${esc(it.o[0])}</button>`
        : `<button class="opt" data-act="answer" data-arg="${i}">${esc(it.o)}</button>`).join("")}
    </div>
    <div id="after" class="stack"></div>`));
}
function answer(i) {
  const { x, opts } = G.cur;
  const btns = document.querySelectorAll("#opts .opt");
  if (btns[0].disabled) return;
  btns.forEach((b, j) => { b.disabled = true; if (opts[j].ok) b.classList.add("correct"); });
  const ok = opts[i].ok;
  if (ok) { grow(1); confetti(12); } else { btns[i].classList.add("wrong"); sfx.no(); }
  document.getElementById("after").innerHTML = `
    <div class="note"><b>${ok ? "Maşallah, doğru!" : "Olsun, bir dahaki sefere!"}</b>${x.info ? esc(x.info) : ok ? "Bahçemize bir fidan dikildi." : "Doğru cevap yeşil olan."}</div>
    <button class="btn big" data-act="next">Devam</button>`;
}

/* Sen Olsan? */
function playSenOlsan(t) {
  const x = pick(SENOLSAN[G.theme], "sen");
  G.cur = x;
  render(card("senolsan", `
    <p class="question">${esc(t.player.name)}, sen olsan ne yapardın?</p>
    <blockquote>${esc(x.s)}</blockquote>
    <p class="muted small">Önce ${esc(t.player.name)} cevaplasın, sonra herkes kendi fikrini söylesin. Komik cevaplar da serbest!</p>
    <div id="after" class="stack">
      <h3>En güzel cevabı kim verdi?</h3>
      <div class="chips">
        ${G.players.map((p, i) => `<button class="chip" data-act="best" data-arg="${i}">${p.av} ${esc(p.name)}</button>`).join("")}
        <button class="chip" data-act="best" data-arg="-1">💚 Hepsi çok güzeldi</button>
      </div>
    </div>`));
}
function best(i) {
  const x = G.cur;
  const who = i >= 0 ? G.players[i] : null;
  grow(who ? 1 : 2); confetti(10);
  document.getElementById("after").innerHTML = `
    <p><b>${who ? `${who.av} ${esc(who.name)} bu turun yıldızı!` : "Bütün aile kazandı!"}</b></p>
    <div class="note"><b>Güzel ahlak ipucu</b>${esc(x.i)}</div>
    <button class="btn big" data-act="next">Devam</button>`;
}

/* Hızlı Tur */
function playHizli() {
  const x = pick(HIZLI[G.theme].concat(HIZLI.genel), "hiz");
  G.cur = { x, count: 0, done: false };
  render(card("hizli", `
    <p class="question">${esc(x.p)}</p>
    <p class="muted">Hedef: <b>${x.t}</b> cevap. Her doğru cevapta büyük düğmeye dokunun!</p>
    <div class="timer" id="timer"><b>30</b></div>
    <button class="counter" id="ctr" data-act="count-up"><b id="ctrn">0</b>/ ${x.t}</button>
    <div id="after" class="stack"></div>`));
  runTimer(30, () => hizliEnd(false));
}
function countUp() {
  const c = G.cur; if (c.done) return;
  c.count++; sfx.tap();
  document.getElementById("ctrn").textContent = c.count;
  if (c.count >= c.x.t) hizliEnd(true);
}
function hizliEnd(win) {
  const c = G.cur; if (c.done) return; c.done = true;
  clearInterval(timerId);
  document.getElementById("ctr").disabled = true;
  if (win) { grow(2); confetti(24); } else if (c.count >= Math.ceil(c.x.t / 2)) grow(1); else sfx.no();
  document.getElementById("after").innerHTML = `
    <div class="note"><b>${win ? "Hedef tamam! Harikasınız!" : `Süre bitti! ${c.count} tane saydınız.`}</b>${win ? "Ailece iki fidan kazandınız." : c.count >= Math.ceil(c.x.t / 2) ? "Yarıyı geçtiniz, bir fidan kazandınız." : "Bir dahaki turda daha hızlı olacağız!"}</div>
    <button class="btn big" data-act="next">Devam</button>`;
}

/* Şaşkın Ebeveyn */
function playSaskin(t) {
  G.saskinCount++;
  const x = pick(SASKIN, "sas");
  G.cur = { x, caught: 0 };
  render(card("saskin", `
    <p class="muted">Sadece <b>${esc(t.player.name)}</b> okusun! Çocuklar bakmasın.</p>
    <blockquote>${esc(x.s)}</blockquote>
    <div id="sas-stage" class="stack">
      <button class="btn big" data-act="sas-go">Okudum, başlıyorum</button>
    </div>`));
}
function sasGo() {
  const name = G.plan[G.i].player.name;
  document.querySelector(".card.game blockquote").outerHTML = `<blockquote><b>Çocuklar!</b> ${esc(name)} şimdi bir şey yapacak ama bazı hatalar yapacak. Hataları yakalayın! Her yakaladığınızda “Yakaladım!” diye bağırın ve düğmeye basın.</blockquote>`;
  document.querySelector(".card.game > p.muted").remove();
  document.getElementById("sas-stage").innerHTML = `
    <button class="counter" data-act="caught"><b id="cn">0</b>hata yakalandı</button>
    <button class="btn big ghost" data-act="sas-done">Gösteri bitti</button>`;
}
function caught() {
  const c = G.cur; if (c.caught >= c.x.h.length + 2) return;
  c.caught++; sfx.tap(); document.getElementById("cn").textContent = c.caught;
}
function sasDone() {
  const c = G.cur;
  const n = Math.min(c.caught, c.x.h.length);
  if (n) { grow(n); confetti(16); } else sfx.no();
  document.getElementById("sas-stage").innerHTML = `
    <div class="note"><b>Doğrusu nasıl?</b><ul class="list">${c.x.h.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>
    <button class="btn big" data-act="next">Devam</button>`;
}

/* Derinlik anı */
function screenDeep() {
  const t = THEMES[G.theme];
  render(`
  <section class="card game" style="--c:var(${t.color})">
    <span class="badge">${t.ico} Derinlik Anı</span>
    <h2>${t.name} bitiyor</h2>
    <p class="muted">Bu gece bahçemize <b>${G.fidan}</b> fidan diktik. Şimdi telefonu bırakıp birkaç dakika sohbet edelim.</p>
    <blockquote>“${esc(t.ayet.text)}”<cite>${esc(t.ayet.ref)}</cite></blockquote>
    <blockquote>Peygamberimiz buyurdu: “${esc(t.hadis.text)}”<cite>${esc(t.hadis.ref)}</cite></blockquote>
    <div class="note"><b>Sohbet sorusu</b>${esc(t.soru)}</div>
    <div class="note"><b>Bu haftanın aile görevi</b>${esc(t.gorev)}</div>
    ${G.players.length >= 2
      ? `<button class="btn big" data-act="secret-start">Gizli iyilik kartlarını dağıt</button>`
      : `<button class="btn big" data-act="end">Geceyi bitir</button>`}
  </section>`);
}

/* Gizli iyilik */
function derange(n) {
  let idx;
  do { idx = shuffle([...Array(n).keys()]); } while (idx.some((v, i) => v === i));
  return idx;
}
function secretStart() {
  const ps = G.players, to = derange(ps.length);
  G.secrets = ps.map((p, i) => {
    const lvl = ageOf(p.age).lvl;
    const deed = rnd(IYILIK.filter(d => d.min <= lvl));
    return { from: p.name, fav: p.av, to: ps[to[i]].name, tav: ps[to[i]].av, deed: deed.d.replace(/\{X:in\}/g, ek(ps[to[i]].name, "in")).replace(/\{X:e\}/g, ek(ps[to[i]].name, "e")).replace(/\{X\}/g, ps[to[i]].name), lvl };
  });
  screenSecret(0, false);
}
function screenSecret(i, shown) {
  const s = G.secrets[i];
  if (!shown) {
    render(`
    <section class="card game handoff" style="--c:var(--plum)">
      <span class="badge" style="align-self:center">🕵️ Gizli İyilik ${i + 1}/${G.secrets.length}</span>
      <div class="face">${s.fav}</div>
      <h2>Telefonu ${esc(ek(s.from, "e"))} verin</h2>
      <p class="muted">Kimse bakmasın! Bu görevi bir hafta boyunca gizlice yapacaksın.${s.lvl === 0 ? " Görevi bir büyük kulağına fısıldasın." : ""}</p>
      <button class="btn big" data-act="secret-show" data-arg="${i}">Kartımı göster</button>
    </section>`);
  } else {
    render(`
    <section class="card game" style="--c:var(--plum)">
      <span class="badge">🕵️ Sadece ${esc(s.from)} baksın</span>
      <div class="secret-word" style="font-size:1.5rem"><span class="em">${s.tav}</span>${esc(s.deed)}</div>
      <p class="muted small">İyiliği gizli yapmak, onu sadece Allah rızası için yapmaktır. Fark ettirmemeye çalış!</p>
      <button class="btn big" data-act="secret-hide" data-arg="${i}">Ezberledim, gizle</button>
    </section>`);
  }
}
function secretHide(i) {
  if (i + 1 < G.secrets.length) screenSecret(i + 1, false);
  else { lastSecrets = G.secrets; store.set("secrets", lastSecrets); screenEnd(); }
}

function screenEnd() {
  const f = G ? G.fidan : 0;
  confetti(30); sfx.ok();
  render(`
  <section class="card handoff">
    <div class="face">🌳</div>
    <h2>Maşallah, ne güzel bir geceydi!</h2>
    <p class="muted">Bu gece <b>${f}</b> fidan diktiniz. Bahçenizde toplam <b>${gardenTotal}</b> fidan var.</p>
    ${lastSecrets ? `<p class="small muted">Gizli iyilikler dağıtıldı. Bir sonraki oyun gecesinde ana sayfadan “Gizli iyilik tahmin turu”nu açın.</p>` : ""}
    <button class="btn big" data-act="home">Ana sayfaya dön</button>
  </section>`);
  G = null;
}

/* Tahmin turu */
function screenGuess(i, shown) {
  const s = lastSecrets[i];
  render(`
  <section class="card game handoff" style="--c:var(--plum)">
    <span class="badge" style="align-self:center">🕵️ Tahmin Turu ${i + 1}/${lastSecrets.length}</span>
    <div class="face">${s.tav}</div>
    <h2>${esc(s.to)}, bu hafta sana kim gizli iyilik yaptı?</h2>
    ${shown
      ? `<div class="note" style="text-align:left"><b>${s.fav} ${esc(s.from)}!</b>Görevi: ${esc(s.deed)}</div>
         <p class="muted small">${esc(s.to)}, ona teşekkür etmeyi unutma! 🤗</p>
         <button class="btn big" data-act="guess-next" data-arg="${i}">${i + 1 < lastSecrets.length ? "Sıradaki" : "Tahmin turu bitti"}</button>`
      : `<p class="muted">Önce ${esc(s.to)} tahmin etsin, sonra herkes tahminini söylesin.</p>
         <button class="btn big" data-act="guess-show" data-arg="${i}">Cevabı göster</button>`}
  </section>`);
}

/* ============ OLAYLAR ============ */
const actions = {
  home: screenHome,
  setup: screenSetup,
  sound() { soundOn = !soundOn; store.set("sound", soundOn); updSnd(); },
  count(d) {
    d = +d;
    if (d > 0 && family.length < 8) family.push({ name: "", age: "c", av: AVATARS[family.length % AVATARS.length] });
    if (d < 0 && family.length > 1) family.pop();
    store.set("family", family); screenSetup();
  },
  avatar(i, el) {
    const p = family[+i]; p.av = AVATARS[(AVATARS.indexOf(p.av) + 1) % AVATARS.length];
    el.textContent = p.av; store.set("family", family); sfx.tap();
  },
  themes() {
    family.forEach(p => p.name = p.name.trim());
    if (family.some(p => !p.name)) { document.getElementById("setup-err").hidden = false; return; }
    store.set("family", family); screenThemes();
  },
  start: startGame,
  play,
  next: nextTurn,
  finish: screenDeep,
  "pan-go": panGo,
  "pan-done": a => panDone(a === "1"),
  answer: a => answer(+a),
  best: a => best(+a),
  "count-up": countUp,
  "sas-go": sasGo,
  caught,
  "sas-done": sasDone,
  "secret-start": secretStart,
  "secret-show": a => screenSecret(+a, true),
  "secret-hide": a => secretHide(+a),
  end: screenEnd,
  guess: a => screenGuess(+a, false),
  "guess-show": a => screenGuess(+a, true),
  "guess-next": a => {
    a = +a;
    if (a + 1 < lastSecrets.length) screenGuess(a + 1, false);
    else { lastSecrets = null; store.set("secrets", null); confetti(); screenHome(); }
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const fn = actions[b.dataset.act];
  if (fn) fn(b.dataset.arg, b);
});
$app.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.field) return;
  family[+el.dataset.i][el.dataset.field] = el.value;
  store.set("family", family);
});
function updSnd() { document.getElementById("snd").textContent = soundOn ? "🔊" : "🔇"; }

updSnd();
renderGarden();
screenHome();
</script>
