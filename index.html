<title>Ailecek Oyun Gecesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ailece oynanan, gülerek İslami değerler öğreten oyun gecesi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Düzen: gökyüzü sahnesi üzerinde tek sütun oyun masası. Üstte rehber Hüdhüd, ortada büyük oyun kartı, altta sallanan aile bahçesi */
:root {
  --sky-top: #9ED8FF;
  --sky-bottom: #E8F7EE;
  --bg: #E8F7EE;
  --surface: #FFFFFF;
  --surface-2: #F3F8F4;
  --ink: #1C2A33;
  --muted: #5B6A72;
  --line: #D6E4DD;
  --cloud: #FFFFFF;
  --hill-1: #8ED19F;
  --hill-2: #5FB97B;
  --leaf: #23935B;
  --on-color: #FFFFFF;
  --sun: #F5A10C;
  --sky: #2E74D6;
  --berry: #D93A76;
  --plum: #7A4BD0;
  --coral: #EE6A3C;
  --ok: #23935B;
  --bad: #D2433A;
  --shadow: rgba(20, 50, 70, .22);
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #0A1430; --sky-bottom: #142B3A; --bg: #142B3A; --surface: #1B2C3A; --surface-2: #223646;
    --ink: #EAF2F7; --muted: #A3B4BF; --line: #2E4456; --cloud: #33485C; --hill-1: #1F5A3D; --hill-2: #17472F;
    --leaf: #4FC985; --on-color: #0D1A24; --sun: #FFC247; --sky: #6FA6F5; --berry: #F57BA8; --plum: #B293F2; --coral: #FF946C;
    --ok: #4FC985; --bad: #FF8A80; --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #0A1430; --sky-bottom: #142B3A; --bg: #142B3A; --surface: #1B2C3A; --surface-2: #223646;
  --ink: #EAF2F7; --muted: #A3B4BF; --line: #2E4456; --cloud: #33485C; --hill-1: #1F5A3D; --hill-2: #17472F;
  --leaf: #4FC985; --on-color: #0D1A24; --sun: #FFC247; --sky: #6FA6F5; --berry: #F57BA8; --plum: #B293F2; --coral: #FF946C;
  --ok: #4FC985; --bad: #FF8A80; --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 28px;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 2.4rem; font-weight: 800; }
h2 { font-size: 1.9rem; font-weight: 800; }
h3 { font-size: 1.25rem; font-weight: 700; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }

/* ---------- Gökyüzü sahnesi ---------- */
.scene { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: linear-gradient(var(--sky-top), var(--sky-bottom) 70%); }
.sun { position: absolute; top: 7%; right: 9%; width: 74px; height: 74px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 0 12px color-mix(in srgb, var(--sun) 25%, transparent), 0 0 60px var(--sun); animation: glow 4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 20px color-mix(in srgb, var(--sun) 15%, transparent), 0 0 80px var(--sun); } }
.cloud { position: absolute; width: 130px; height: 42px; background: var(--cloud); border-radius: 40px; opacity: .9; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
.cloud::before { width: 60px; height: 60px; top: -30px; left: 18px; }
.cloud::after { width: 46px; height: 46px; top: -20px; left: 64px; }
.cloud.c1 { top: 12%; animation-duration: 70s; animation-delay: -10s; }
.cloud.c2 { top: 28%; transform: scale(.7); animation-duration: 95s; animation-delay: -50s; }
.cloud.c3 { top: 46%; transform: scale(.55); animation-duration: 120s; animation-delay: -80s; opacity: .6; }
@keyframes drift { from { left: -180px; } to { left: 110%; } }
.stars { position: absolute; inset: 0 0 40% 0; opacity: 0; background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 70% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 40% 60%, #fff, transparent), radial-gradient(2px 2px at 85% 45%, #fff, transparent), radial-gradient(1.5px 1.5px at 10% 70%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 35%, #fff, transparent); animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { filter: brightness(.5); } }
.hills { position: absolute; left: -10%; right: -10%; bottom: -60px; height: 200px; border-radius: 50% 50% 0 0; background: var(--hill-1); }
.hills::after { content: ""; position: absolute; left: 30%; right: -20%; bottom: 0; height: 150px; border-radius: 50% 50% 0 0; background: var(--hill-2); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stars { opacity: 1; } :root:not([data-theme="light"]) .sun { box-shadow: inset -18px -6px 0 0 var(--sky-top); background: #FFE7A3; } }
:root[data-theme="dark"] .stars { opacity: 1; }
:root[data-theme="dark"] .sun { box-shadow: inset -18px -6px 0 0 var(--sky-top); background: #FFE7A3; }

.shell { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* ---------- Üst bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; color: var(--leaf); background: var(--surface); border: 0; padding: 2px 16px; border-radius: 999px; box-shadow: 0 4px 0 var(--line); }
.logo span { color: var(--sun); }
.top-right { display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--surface); box-shadow: 0 4px 0 var(--line); font-weight: 800; font-variant-numeric: tabular-nums; }
.pill.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.3); } }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: 0 4px 0 var(--line); font-size: 1.15rem; }
.icon-btn.off { opacity: .5; }

/* ---------- Ekran geçişi ---------- */
.screen { display: flex; flex-direction: column; gap: 14px; animation: enter .4s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes enter { from { transform: translateY(18px) scale(.97); } }

/* ---------- Rehber Hüdhüd ---------- */
.guide { display: grid; grid-template-columns: 96px 1fr; gap: 6px; align-items: end; text-align: left; width: 100%; }
.guide.big { grid-template-columns: 130px 1fr; }
.hudhud { width: 100%; height: auto; overflow: visible; animation: hop 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px) rotate(-2deg); } }
.hudhud .crest { transform-origin: 74px 34px; animation: crest 3.2s ease-in-out infinite; }
@keyframes crest { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-14deg); } 90% { transform: rotate(6deg); } }
.hudhud .lid { transform-origin: 79px 44px; transform: scaleY(0); animation: blink 4.5s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
.hudhud .wing { transform-origin: 46px 64px; }
.hudhud.happy .wing { animation: flap .25s ease-in-out 6; }
@keyframes flap { 50% { transform: rotate(-28deg); } }
.hudhud .jaw { transform-origin: 92px 50px; }
.hudhud.talk .jaw { animation: talk .22s ease-in-out infinite; }
@keyframes talk { 50% { transform: rotate(12deg); } }
.bubble { position: relative; background: var(--surface); border-radius: 22px 22px 22px 6px; padding: 12px 16px; font-weight: 800; font-size: 1.12rem; box-shadow: 0 5px 0 var(--line); margin-bottom: 22px; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; min-width: 0; }
.card .bubble { background: var(--surface-2); }
.card .bubble::before { border-right-color: var(--surface-2); }
.bubble::before { content: ""; position: absolute; left: -10px; bottom: 6px; border: 10px solid transparent; border-right-color: var(--surface); border-left: 0; }
.bubble .say { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: 0 3px 0 var(--line); font-size: 1rem; }

/* ---------- Butonlar ---------- */
.btn { --b: var(--leaf); border: 0; border-radius: 20px; padding: 14px 20px; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; background: var(--b); color: var(--on-color); min-height: 58px; box-shadow: 0 6px 0 color-mix(in srgb, var(--b) 60%, #000); transform: translateY(0); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 color-mix(in srgb, var(--b) 60%, #000); }
.btn.big { font-size: 1.45rem; min-height: 70px; width: 100%; }
.btn.sun { --b: var(--sun); color: #1C2A33; }
.btn.berry { --b: var(--berry); }
.btn.sky { --b: var(--sky); }
.btn.plum { --b: var(--plum); }
.btn.coral { --b: var(--coral); }
.btn.ghost { background: var(--surface-2); color: var(--ink); box-shadow: 0 6px 0 var(--line); }
.btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.04); } }
.btn[disabled] { opacity: .45; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.link { background: none; border: 0; color: var(--ink); opacity: .7; text-decoration: underline; padding: 8px; font-weight: 700; font-size: .95rem; }

/* ---------- Kartlar ---------- */
.card { position: relative; background: var(--surface); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 0 var(--line), 0 18px 30px -16px var(--shadow); }
.card.game { border-top: 10px solid var(--c, var(--leaf)); }
.turnline { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
.badge { white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: .85rem; letter-spacing: .05em; text-transform: uppercase; background: color-mix(in srgb, var(--c, var(--leaf)) 18%, var(--surface)); }
.dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--leaf); }
.dots i.now { background: var(--sun); animation: pulse 1s infinite; }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.center { text-align: center; align-items: center; }
.bold { font-weight: 800; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 0; background: var(--surface-2); border-radius: 999px; padding: 10px 16px; font-weight: 800; min-height: 48px; box-shadow: 0 4px 0 var(--line); }
.chip.tag { min-height: 0; padding: 6px 12px; box-shadow: none; font-size: .95rem; background: color-mix(in srgb, var(--c, var(--leaf)) 14%, var(--surface)); }

/* Büyük animasyonlu simge */
.mega { font-size: 6rem; line-height: 1; text-align: center; display: block; }
.mega.bounce { animation: bounce 1s cubic-bezier(.3, 1.8, .5, 1) infinite alternate; }
.mega.wiggle { animation: wiggle 1.2s ease-in-out infinite; }
.mega.hover { animation: floaty 3s ease-in-out infinite; }
.mega.walk { display: inline-block; animation: walk 2.4s ease-in-out infinite; }
@keyframes bounce { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-16px) scale(1.04, .96); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
@keyframes floaty { 50% { transform: translateY(-10px); } }
@keyframes walk { 0% { transform: translateX(-70px) rotate(-6deg); } 12% { transform: translateX(-35px) translateY(-10px) rotate(6deg); } 25% { transform: translateX(0) rotate(-6deg); } 37% { transform: translateX(35px) translateY(-10px) rotate(6deg); } 49% { transform: translateX(70px) rotate(-6deg); } 50% { transform: translateX(70px) scaleX(-1); } 62% { transform: translateX(35px) translateY(-10px) scaleX(-1) rotate(-6deg); } 75% { transform: translateX(0) scaleX(-1) rotate(6deg); } 87% { transform: translateX(-35px) translateY(-10px) scaleX(-1) rotate(-6deg); } 100% { transform: translateX(-70px) scaleX(-1); } }
.big-text { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; text-align: center; line-height: 1.2; text-wrap: balance; }

/* Çark */
.wheel-wrap { position: relative; width: min(290px, 76vw); aspect-ratio: 1; max-width: 100%; margin: 6px auto 0; }
.wheel-wrap::after { content: ""; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); border: 16px solid transparent; border-top: 30px solid var(--ink); border-bottom: 0; }
#wheel { width: 100%; height: 100%; transition: transform 3.2s cubic-bezier(.12, .72, .16, 1); }
.avatar-big { font-size: 4.5rem; line-height: 1; animation: hop 1.6s ease-in-out infinite; }

/* Çevrilen kart */
.flip { perspective: 1200px; width: 100%; }
.flip-inner { position: relative; min-height: 260px; transition: transform .7s cubic-bezier(.3, 1.3, .5, 1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.side { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px; text-align: center; }
.side.front { background: repeating-linear-gradient(45deg, var(--c), var(--c) 16px, color-mix(in srgb, var(--c) 82%, #fff) 16px, color-mix(in srgb, var(--c) 82%, #fff) 32px); color: var(--on-color); border: 0; width: 100%; }
.side.front .q { font-size: 5rem; font-family: var(--font-display); font-weight: 800; line-height: 1; animation: wiggle 1.5s infinite; }
.side.front b { font-family: var(--font-display); font-size: 1.5rem; background: rgba(0, 0, 0, .2); color: #FFFFFF; padding: 4px 16px; border-radius: 999px; }
.side.front small { font-weight: 800; background: rgba(0, 0, 0, .2); color: #FFFFFF; padding: 2px 12px; border-radius: 999px; }
.side.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 4px dashed color-mix(in srgb, var(--c) 50%, var(--surface)); }
.side.back .word { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; line-height: 1.1; }

/* Zamanlayıcı */
.timer { --p: 1; width: 150px; height: 150px; flex: none; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: conic-gradient(var(--c, var(--leaf)) calc(var(--p) * 360deg), var(--line) 0); }
.timer b { width: 78%; height: 78%; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-display); font-size: 3rem; font-variant-numeric: tabular-nums; }
.timer.sm { width: 104px; height: 104px; }
.timer.sm b { font-size: 2.2rem; }
.timer.low { animation: shake .4s infinite; }
.timer.low b { color: var(--bad); }
@keyframes shake { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }

/* Seçenek kutuları */
.opts { display: grid; gap: 12px; }
.opts.pics { grid-template-columns: repeat(3, 1fr); }
.opt { --oc: var(--sky); position: relative; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 20px; border: 0; background: var(--surface-2); font-weight: 800; font-size: 1.15rem; min-height: 64px; box-shadow: 0 5px 0 color-mix(in srgb, var(--oc) 45%, var(--line)); }
.opt .ltr { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--oc); color: var(--on-color); font-family: var(--font-display); }
.opts.pics .opt { flex-direction: column; justify-content: center; text-align: center; gap: 2px; font-size: .95rem; padding: 10px 6px; }
.opts.pics .opt .em { font-size: 3rem; line-height: 1.1; }
.opt:nth-child(1) { --oc: var(--berry); } .opt:nth-child(2) { --oc: var(--sky); } .opt:nth-child(3) { --oc: var(--sun); }
.opt.correct { background: color-mix(in srgb, var(--ok) 22%, var(--surface)); box-shadow: 0 5px 0 var(--ok); animation: bounce .35s 2 alternate; }
.opt.wrong { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); animation: shake .3s 2; }
.opt.dim { opacity: .5; }

/* Mühür */
.stamp { font-family: var(--font-display); font-size: 2.3rem; font-weight: 800; text-align: center; color: var(--c); border: 6px solid var(--c); border-radius: 18px; padding: 2px 18px; align-self: center; transform: rotate(-5deg); animation: stamp .45s cubic-bezier(.3, 1.6, .5, 1); line-height: 1.2; }
@keyframes stamp { from { transform: rotate(-5deg) scale(3); opacity: 0; } }
.duo { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.duo > div:not(.timer) { text-align: center; font-weight: 800; font-size: .95rem; }
.duo .mega { font-size: 3.4rem; }
.freeze { font-family: var(--font-display); font-size: 4.5rem; font-weight: 800; text-align: center; color: var(--sky); animation: stamp .4s cubic-bezier(.3, 1.6, .5, 1); line-height: 1; }

.counter { width: 100%; padding: 22px; border-radius: 28px; border: 0; background: var(--c); color: var(--on-color); font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; box-shadow: 0 8px 0 color-mix(in srgb, var(--c) 60%, #000); animation: pulse 1.2s infinite; }
.counter:active { transform: translateY(6px) scale(.98); box-shadow: 0 2px 0 color-mix(in srgb, var(--c) 60%, #000); }
.counter b { display: block; font-size: 4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.counter[disabled] { animation: none; opacity: .6; }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 32px 1fr; gap: 8px; align-items: start; padding: 10px 12px; border-radius: 16px; background: color-mix(in srgb, var(--ok) 12%, var(--surface)); font-weight: 700; animation: enter .4s backwards; }
.checks li:nth-child(2) { animation-delay: .15s; } .checks li:nth-child(3) { animation-delay: .3s; }
.tip { padding: 14px 16px; border-radius: 20px; background: color-mix(in srgb, var(--sun) 16%, var(--surface)); font-weight: 700; }
.tip b { display: block; font-family: var(--font-display); font-size: 1.1rem; }
blockquote { margin: 0; font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1.3; text-align: center; text-wrap: balance; }
blockquote cite { display: block; margin-top: 8px; font-family: var(--font-body); font-style: normal; color: var(--muted); font-size: .9rem; font-weight: 700; }

/* Ana sayfa oyun simgeleri */
.icons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.icons div { background: var(--surface); border-radius: 22px; padding: 12px 6px; text-align: center; font-weight: 800; font-size: .85rem; line-height: 1.2; box-shadow: 0 5px 0 var(--line); }
.icons span { display: block; font-size: 2.3rem; margin-bottom: 4px; animation: floaty 3s ease-in-out infinite; }
.icons div:nth-child(2n) span { animation-delay: -1s; } .icons div:nth-child(3n) span { animation-delay: -2s; }
details { background: var(--surface); border-radius: 22px; padding: 14px 16px; box-shadow: 0 5px 0 var(--line); }
details summary { cursor: pointer; font-weight: 800; }
details ul { margin: 10px 0 0; padding-left: 1.2em; display: grid; gap: 6px; font-size: .95rem; }

/* Kurulum */
.stepper { display: flex; align-items: center; justify-content: center; gap: 18px; }
.stepper b { font-family: var(--font-display); font-size: 2.6rem; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper button { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--surface-2); box-shadow: 0 5px 0 var(--line); font-size: 1.8rem; font-weight: 800; }
.player-row { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: center; padding: 10px; border-radius: 20px; background: var(--surface-2); animation: enter .35s backwards; }
.player-row .fields { display: grid; grid-template-columns: 1fr 124px; gap: 8px; min-width: 0; }
.avatar-btn { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--surface); font-size: 2rem; box-shadow: 0 4px 0 var(--line); }
.avatar-btn span { display: inline-block; animation: hop 2s ease-in-out infinite; }
.player-row input, .player-row select { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); min-height: 48px; font-weight: 700; }
@media (max-width: 390px) { .player-row .fields { grid-template-columns: 1fr; } }

/* Temalar */
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.theme-card { border: 0; background: var(--surface); border-radius: 24px; padding: 14px 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 55%, var(--line)); }
.theme-card .ico { font-size: 2.6rem; width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 20%, var(--surface)); animation: floaty 3s ease-in-out infinite; }
.theme-card:nth-child(2n) .ico { animation-delay: -1.5s; }
.theme-card h3 { font-size: 1.15rem; }
.theme-card small { color: var(--muted); font-weight: 700; line-height: 1.25; font-size: .85rem; }
.theme-card:active { transform: translateY(4px); }

/* Bahçe */
.garden { position: relative; overflow: hidden; background: linear-gradient(color-mix(in srgb, var(--sky) 10%, var(--surface)), var(--surface)); border-radius: 26px; padding: 14px 16px 0; box-shadow: 0 6px 0 var(--line); }
.garden-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.garden-plants { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 0 2px; font-size: 1.7rem; min-height: 44px; align-items: flex-end; padding-bottom: 4px; }
.garden-plants span { display: inline-block; transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite; }
.garden-plants span.new { animation: sprout .7s cubic-bezier(.3, 1.7, .5, 1), sway 2.6s ease-in-out .7s infinite; }
.garden-plants .empty { animation: none; font-size: .95rem; font-weight: 700; color: var(--muted); }
@keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
@keyframes sprout { from { transform: scale(0); } }
.garden-ground { height: 14px; margin: 0 -16px; background: var(--hill-2); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
.garden-plants .butterfly { position: absolute; z-index: 2; font-size: 1.3rem; animation: flutter 9s ease-in-out infinite; }
@keyframes flutter { 0% { left: 5%; top: 0; } 25% { left: 45%; top: -20px; } 50% { left: 85%; top: 0; } 75% { left: 40%; top: 10px; } 100% { left: 5%; top: 0; } }

.float { position: fixed; left: 50%; top: 42%; font-family: var(--font-display); font-size: 2.6rem; font-weight: 800; color: var(--leaf); pointer-events: none; animation: up 1.2s ease-out forwards; z-index: 30; text-shadow: 0 3px 0 var(--surface); }
@keyframes up { from { transform: translate(-50%, 0) scale(.5); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -10px) scale(1.2); } to { transform: translate(-50%, -130px); opacity: 0; } }
.confetti { position: fixed; top: -40px; font-size: 1.7rem; pointer-events: none; z-index: 29; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(600deg); } }
.flash { position: fixed; inset: 0; z-index: 28; pointer-events: none; background: var(--sky); animation: flash .5s forwards; }
@keyframes flash { from { opacity: .45; } to { opacity: 0; } }
.foot { text-align: center; font-size: .8rem; color: var(--ink); opacity: .7; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .float, .confetti, .flash, .butterfly { display: none; }
}
</style>

<div class="scene" aria-hidden="true">
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="hills"></div>
</div>

<div class="shell">
  <header class="top">
    <button class="logo" data-act="home" aria-label="Ana sayfa">Aile<span>cek</span></button>
    <div class="top-right">
      <span class="pill" id="gpill" title="Bahçemizdeki fidanlar">🌱 <span id="gcount">0</span></span>
      <button class="icon-btn" id="voice" data-act="voice" aria-label="Sesli anlatımı aç/kapat">🗣️</button>

</div>

<script src="icerik.js"></script>
<script>
/* ============ YARDIMCILAR ============ */
const store = {
  get(k, d) { try { const v = localStorage.getItem("ailecek:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ailecek:" + k, JSON.stringify(v)); } catch (e) {} }
};
const $app = document.getElementById("app");
const ageOf = id => AGES.find(a => a.id === id) || AGES[4];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const optText = o => Array.isArray(o) ? o[0] : o;

/* Türkçe ekler: Zeynep'te, Ömer'e, Anne'nin */
function lastVowel(w) { const m = w.toLocaleLowerCase("tr").match(/[aeıioöuü](?=[^aeıioöuü]*$)/); return m ? m[0] : "e"; }
const endsVowel = w => /[aeıioöuü]$/i.test(w.toLocaleLowerCase("tr"));
function ek(name, type) {
  const v = lastVowel(name), back = "aıou".includes(v), n = String(name);
  if (type === "de") { const hard = /[fstkçşhp]$/.test(n.toLocaleLowerCase("tr")); return n + "'" + (hard ? "t" : "d") + (back ? "a" : "e"); }
  if (type === "e") return n + "'" + (endsVowel(n) ? "y" : "") + (back ? "a" : "e");
  const four = { a: "ı", ı: "ı", e: "i", i: "i", o: "u", u: "u", ö: "ü", ü: "ü" }[v] || "i";
  return n + "'" + (endsVowel(n) ? "n" : "") + four + "n";
}

/* ============ DURUM ============ */
const DEFAULT_FAMILY = [
  { name: "Anne", age: "y", av: "🦉" },
  { name: "Baba", age: "y", av: "🐻" },
  { name: "Zeynep", age: "o", av: "🦊" },
  { name: "Ömer", age: "k", av: "🐰" }
];
let family = store.get("family", DEFAULT_FAMILY);
let gardenTotal = store.get("garden", 0);
let lastSecrets = store.get("secrets", null);
let soundOn = store.get("sound", true);
let voiceOn = store.get("voice", true);
let G = null;
let timers = [];
let lastPlantCount = gardenTotal;

function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
function every(fn, ms) { const id = setInterval(fn, ms); timers.push(id); return id; }
function clearTimers() { timers.forEach(id => { clearTimeout(id); clearInterval(id); }); timers = []; stopDrum(); }

function pick(pool, key) {
  const used = G.used[key] || (G.used[key] = new Set());
  let avail = pool.filter(x => !used.has(x));
  if (!avail.length) { used.clear(); avail = pool; }
  const x = rnd(avail); used.add(x); return x;
}

/* ============ SES: efektler, davul ve sesli anlatım ============ */
let ac = null;
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; }
function tone(f, d, type = "sine", when = 0, vol = 0.18) {
  if (!soundOn || !audio()) return;
  try {
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.05);
  } catch (e) {}
}
function thump(when = 0, f = 110, vol = 0.5) {
  if (!soundOn || !audio()) return;
  try {
    const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.18);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.25);
  } catch (e) {}
}
const sfx = {
  ok() { tone(660, .14); tone(880, .14, "sine", .1); tone(1175, .3, "sine", .2); },
  no() { tone(300, .18, "triangle"); tone(220, .35, "triangle", .15); },
  tick() { tone(1300, .04, "square", 0, .08); },
  end() { tone(523, .2, "triangle"); tone(392, .45, "triangle", .2); },
  pop() { tone(900, .06, "sine"); tone(1400, .08, "sine", .05); },
  flip() { tone(400, .08, "triangle"); tone(700, .1, "triangle", .06); },
  stop() { thump(0, 160, .7); tone(880, .5, "square", 0, .12); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .25, "triangle", i * .12)); }
};
let drumId = null;
function startDrum() { stopDrum(); let n = 0; drumId = setInterval(() => { thump(0, n % 2 ? 90 : 130, n % 2 ? .3 : .55); n++; }, 380); }
function stopDrum() { if (drumId) { clearInterval(drumId); drumId = null; } }

const tts = { ok: "speechSynthesis" in window, voice: null };
function pickVoice() { try { const vs = speechSynthesis.getVoices(); tts.voice = vs.find(v => /^tr/i.test(v.lang)) || null; } catch (e) {} }
if (tts.ok) { pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {} }
const plain = t => String(t).replace(/[\p{Extended_Pictographic}‍️]/gu, "").replace(/[“”"]/g, "").replace(/\s+/g, " ").trim();
function setTalking(on) { document.querySelectorAll(".hudhud").forEach(h => h.classList.toggle("talk", on)); }
function say(text) {
  if (!voiceOn || !tts.ok || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(plain(text));
    u.lang = "tr-TR"; if (tts.voice) u.voice = tts.voice;
    u.rate = 0.95; u.pitch = 1.15;
    u.onstart = () => setTalking(true);
    u.onend = u.onerror = () => setTalking(false);
    speechSynthesis.speak(u);
  } catch (e) {}
}
function hush() { try { tts.ok && speechSynthesis.cancel(); } catch (e) {} setTalking(false); }

/* ============ EFEKTLER ============ */
function floatText(t) { const el = document.createElement("div"); el.className = "float"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1300); }
function confetti(n = 18) {
  const set = ["🌱", "🌸", "✨", "🌿", "⭐", "🌼", "🎉"];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("span"); el.className = "confetti"; el.textContent = rnd(set);
    el.style.left = Math.random() * 100 + "vw"; el.style.animationDelay = Math.random() * .5 + "s";
    document.body.appendChild(el); setTimeout(() => el.remove(), 2500);
  }
}
function flash() { const el = document.createElement("div"); el.className = "flash"; document.body.appendChild(el); setTimeout(() => el.remove(), 600); }
function happy() { document.querySelectorAll(".hudhud").forEach(h => { h.classList.remove("happy"); void h.offsetWidth; h.classList.add("happy"); }); }
function grow(n) {
  if (n <= 0) return;
  gardenTotal += n; if (G) G.fidan += n;
  store.set("garden", gardenTotal);
  floatText("+" + n + " 🌱"); sfx.ok(); happy();
  const pill = document.getElementById("gpill"); pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump");
  renderGarden();
}

/* ============ HÜDHÜD (rehber) ============ */
const HUDHUD_SVG = `
<svg class="hudhud" viewBox="0 0 120 120" aria-hidden="true">
  <g class="crest">
    <path d="M70 34 Q58 6 64 2 Q70 8 72 32Z" fill="#F08A3C"/><path d="M64 2 Q62 8 66 12 Q68 6 64 2Z" fill="#2B2B2B"/>
    <path d="M74 32 Q72 2 80 0 Q82 8 78 32Z" fill="#F4A04F"/><path d="M80 0 Q77 5 79 9 Q82 5 80 0Z" fill="#2B2B2B"/>
    <path d="M78 33 Q88 6 95 6 Q94 14 82 35Z" fill="#F08A3C"/><path d="M95 6 Q90 8 90 13 Q94 11 95 6Z" fill="#2B2B2B"/>
    <path d="M67 37 Q48 16 52 10 Q60 16 70 36Z" fill="#E87B30"/><path d="M52 10 Q51 16 55 18 Q56 13 52 10Z" fill="#2B2B2B"/>
  </g>
  <path d="M24 84 L6 96 L10 100 L30 90Z" fill="#2B2B2B"/>
  <path d="M10 99 L28 89" stroke="#FFFFFF" stroke-width="3"/>
  <ellipse cx="54" cy="76" rx="32" ry="26" fill="#EBA56C"/>
  <ellipse cx="60" cy="84" rx="20" ry="14" fill="#F6C99A"/>
  <g class="wing">
    <path d="M30 62 Q52 50 66 68 Q56 92 30 88 Q22 76 30 62Z" fill="#2B2B2B"/>
    <path d="M32 70 Q48 64 60 72 M30 78 Q46 74 58 80 M32 85 Q44 82 54 86" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="76" cy="46" r="19" fill="#EBA56C"/>
  <circle cx="72" cy="54" r="5" fill="#F7A0A0" opacity=".7"/>
  <circle cx="79" cy="44" r="6.5" fill="#FFFFFF"/>
  <circle cx="80.5" cy="44" r="3.6" fill="#1C2A33"/>
  <circle cx="82" cy="42.5" r="1.3" fill="#FFFFFF"/>
  <g class="lid"><circle cx="79" cy="44" r="7" fill="#EBA56C"/></g>
  <path d="M92 46 Q106 46 116 52 Q104 50 92 50Z" fill="#3A3A3A"/>
  <path class="jaw" d="M92 50 Q104 52 114 54 Q104 56 92 53Z" fill="#555555"/>
  <path d="M48 100 L46 112 M60 100 L62 112 M42 112 L50 112 M58 112 L66 112" stroke="#8A8A8A" stroke-width="3" stroke-linecap="round"/>
</svg>`;
function guide(text, opts = {}) {
  return `<div class="guide ${opts.big ? "big" : ""}">${HUDHUD_SVG}
    <div class="bubble"><span>${esc(text)}</span>${opts.noSpeak || !tts.ok ? "" : `<button class="say" data-act="say" data-arg="${esc(text)}" aria-label="Tekrar dinle">🔈</button>`}</div></div>`;
}

/* ============ BAHÇE ============ */
const PLANTS = ["🌱", "🌿", "🌷", "🌱", "🌳", "🌻", "🌿", "🌸", "🌱", "🍀", "🌼", "🌲", "🍎", "🌹"];
function renderGarden() {
  document.getElementById("gcount").textContent = gardenTotal;
  const show = Math.min(gardenTotal, 48), start = gardenTotal - show;
  let html = "";
  for (let i = start; i < gardenTotal; i++) {
    const isNew = i >= lastPlantCount;
    html += `<span class="${isNew ? "new" : ""}"${isNew ? "" : ` style="animation-delay:${-(i % 7) * .37}s"`}>${PLANTS[i % PLANTS.length]}</span>`;
  }
  const bugs = (gardenTotal >= 8 ? `<span class="butterfly">🦋</span>` : "") + (gardenTotal >= 20 ? `<span class="butterfly" style="animation-delay:-4s;animation-duration:12s">🐝</span>` : "");
  document.getElementById("plants").innerHTML = (html || `<span class="empty">İlk fidanı oyunda kazanacaksınız!</span>`) + bugs;
  document.getElementById("gnote").textContent = gardenTotal ? `${gardenTotal} fidan` : "";
  lastPlantCount = gardenTotal;
}

/* ============ EKRAN ============ */
function render(html, speak) {
  clearTimers(); hush();
  $app.innerHTML = `<div class="screen">${html}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (speak) later(() => say(speak), 350);
}

function screenHome() {
  G = null;
  const line = lastSecrets ? "Selâmün aleyküm! Gizli iyilikleri yaptınız mı? Hadi tahmin edelim!" : "Selâmün aleyküm! Ben Hüdhüd. Bu akşam ailecek oynayalım mı?";
  render(`
    ${guide(line, { big: true })}
    <button class="btn big pulse" data-act="setup">Oyuna Başla ▶</button>
    ${lastSecrets ? `<button class="btn big sun" data-act="guess" data-arg="0">🕵️ Gizli İyilik Tahmini</button>` : ""}
    <div class="icons">
      ${["pandomim", "ses", "hayvan", "bilgi", "hoca", "saskin"].map(k => `<div><span>${GAMES[k].ico}</span>${GAMES[k].name}</div>`).join("")}
    </div>
    <details>
      <summary>Büyükler için: Nasıl oynanır?</summary>
      <ul>
        <li>Masaya tek telefon koyun. Sırası gelen çarkı çevirir.</li>
        <li>Hüdhüd soruları sesli okur; gizli kartları okumaz. Sesi sağ üstteki 🗣️ düğmesinden kapatabilirsiniz.</li>
        <li>Her başarı ortak bahçeye fidan diker. Rekabet yok, aile tek takım.</li>
        <li>Gece sonunda kısa bir sohbet ve herkese gizli bir iyilik görevi var.</li>
        <li>Pandomimde peygamberler ve sahabeler canlandırılmaz; sadece hayvanlar, nesneler ve davranışlar.</li>
      </ul>
    </details>`, line);
}

function screenSetup() {
  const rows = family.map((p, i) => `
    <div class="player-row" style="animation-delay:${i * .06}s">
      <button class="avatar-btn" data-act="avatar" data-arg="${i}" aria-label="Simge değiştir"><span>${p.av}</span></button>
      <div class="fields">
        <input id="name-${i}" data-field="name" data-i="${i}" value="${esc(p.name)}" placeholder="İsim" maxlength="16" aria-label="İsim">
        <select id="age-${i}" data-field="age" data-i="${i}" aria-label="Yaş aralığı">
          ${AGES.map(a => `<option value="${a.id}" ${a.id === p.age ? "selected" : ""}>${a.label}</option>`).join("")}
        </select>
      </div>
    </div>`).join("");
  render(`
    ${guide("Kimler oynuyor? Hayvana dokunup değiştirebilirsin!", { noSpeak: true })}
    <section class="card">
      <div class="stepper">
        <button data-act="count" data-arg="-1" aria-label="Bir kişi çıkar">−</button>
        <b>${family.length}</b>
        <button data-act="count" data-arg="1" aria-label="Bir kişi ekle">+</button>
      </div>
      <div class="stack">${rows}</div>
      <p class="small bold" id="setup-err" hidden style="color:var(--bad)">Herkese bir isim verelim.</p>
      <button class="btn big" data-act="themes">Devam ▶</button>
    </section>`);
}

function screenThemes() {
  const line = "Bu gece hangi tema?";
  render(`
    ${guide(line)}
    <div class="themes">
      ${Object.entries(THEMES).map(([k, t]) => `
        <button class="theme-card" style="--c:var(${t.color})" data-act="start" data-arg="${k}">
          <span class="ico">${t.ico}</span><h3>${t.name.replace(" Gecesi", "")}</h3><small>${t.desc}</small>
        </button>`).join("")}
      <button class="theme-card" style="--c:var(--sun)" data-act="start" data-arg="random">
        <span class="ico">🎲</span><h3>Sürpriz</h3><small>Temayı Hüdhüd seçsin!</small>
      </button>
    </div>`, line);
}

/* ============ OYUN AKIŞI ============ */
const WHEEL = ["pandomim", "bilgi", "ses", "senolsan", "hoca", "saskin"];
const GROUPS = ["hayvan", "kalkotur", "hizli"];

function startGame(themeKey) {
  if (themeKey === "random") themeKey = rnd(Object.keys(THEMES));
  const players = family.map(p => ({ ...p }));
  const n = players.length;
  const total = Math.max(6, Math.min(12, n * 2 + 2));
  const plan = []; let p = 0, g = 0;
  for (let t = 0; t < total; t++) {
    if ((t + 1) % 4 === 0) plan.push({ group: true, type: GROUPS[g++ % GROUPS.length] });
    else plan.push({ player: players[p++ % n] });
  }
  G = { theme: themeKey, players, plan, i: 0, fidan: 0, used: {}, lastType: null, saskinCount: 0 };
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  const t = THEMES[themeKey], line = `Bu gece ${t.name}! Hazır mısınız?`;
  render(`
    <section class="card center game" style="--c:var(${t.color})">
      <span class="mega bounce">${t.ico}</span>
      <h2>${t.name}</h2>
      ${guide(line, { noSpeak: true })}
      <button class="btn big pulse" data-act="turn">Başlayalım! ▶</button>
    </section>`, line);
}

function chooseType(player) {
  const adult = player.age === "y", lvl = ageOf(player.age).lvl;
  const hasKid = G.players.some(p => p.age !== "y");
  const w = { pandomim: 3, ses: 2.2, bilgi: 1.8, senolsan: lvl === 0 ? .6 : 1.1 };
  if (!adult && lvl >= 1 && G.players.length > 1) w.hoca = 1.4;
  if (adult && hasKid && G.saskinCount < 2) w.saskin = 1.8;
  delete w[G.lastType];
  const entries = Object.entries(w), sum = entries.reduce((a, [, v]) => a + v, 0);
  let r = Math.random() * sum;
  for (const [k, v] of entries) { if ((r -= v) <= 0) return k; }
  return "pandomim";
}

function header(type, label) {
  const g = GAMES[type];
  const dots = G.plan.map((_, i) => `<i class="${i < G.i ? "on" : i === G.i ? "now" : ""}"></i>`).join("");
  return `<div class="turnline"><span class="badge">${label || g.ico + " " + g.name}</span><div class="dots" aria-label="Tur ${G.i + 1} / ${G.plan.length}">${dots}</div></div>`;
}
const card = (type, inner, label) => `<section class="card game" style="--c:var(${GAMES[type].color})">${header(type, label)}${inner}</section>
  <div style="text-align:center"><button class="link" data-act="finish">Oyunu bitir ve sohbete geç</button></div>`;

function wheelSVG() {
  const n = WHEEL.length, r = 104, c = 110; let s = "";
  const pt = (a, rr) => [(c + rr * Math.cos(a)).toFixed(1), (c + rr * Math.sin(a)).toFixed(1)];
  WHEEL.forEach((t, i) => {
    const a0 = i / n * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / n * 2 * Math.PI - Math.PI / 2, am = (a0 + a1) / 2;
    s += `<path d="M${c},${c} L${pt(a0, r)} A${r},${r} 0 0 1 ${pt(a1, r)} Z" fill="var(${GAMES[t].color})" stroke="var(--surface)" stroke-width="4"/>`;
    const [tx, ty] = pt(am, r * .64);
    s += `<text x="${tx}" y="${ty}" font-size="34" text-anchor="middle" dominant-baseline="central">${GAMES[t].ico}</text>`;
  });
  return `<svg viewBox="0 0 220 220" id="wheel" aria-hidden="true"><circle cx="110" cy="110" r="109" fill="var(--line)"/>${s}<circle cx="110" cy="110" r="18" fill="var(--surface)" stroke="var(--ink)" stroke-width="4"/></svg>`;
}

    </div>`, "🎡 Oyun Çarkı"), line);

function spin() {
  const t = G.plan[G.i], idx = WHEEL.indexOf(t.type);
  const wheel = document.getElementById("wheel");
  document.getElementById("spin-area").innerHTML = `<p class="big-text muted">Dönüyor…</p>`;
  const deg = 360 * 6 + (360 - (idx + .5) * 60) + (Math.random() * 30 - 15);
  hush();
  requestAnimationFrame(() => { wheel.style.transform = `rotate(${deg}deg)`; });
  let gap = 45, el = 0;
  const tickLoop = () => { sfx.tick(); el += gap; gap *= 1.12; if (el < 3000) later(tickLoop, gap); };
  tickLoop();
  later(() => landed(t), 3300);
}

function runTimer(sec, onEnd) {
  const el = document.getElementById("timer"); let left = sec;
  const draw = () => { if (!el) return; el.style.setProperty("--p", left / sec); el.querySelector("b").textContent = left; el.classList.toggle("low", left <= 5); };
  draw();
  const id = every(() => {
    left--; draw();
    if (left <= 5 && left > 0) sfx.tick();
    if (left <= 0) { clearInterval(id); sfx.end(); onEnd && onEnd(); }
  }, 1000);
}

    ${step === 0 ? guide(introText, { noSpeak: true }) : ""}
    <section class="card game center" style="--c:var(${t.color})">
      <div class="turnline"><span class="badge">${t.ico} Derinlik Anı</span><div class="dots">${slides.map((_, i) => `<i class="${i < step ? "on" : i === step ? "now" : ""}"></i>`).join("")}</div></div>
      <span class="mega hover">${s.ico}</span>
      <h3>${s.title}</h3>
      ${s.body}
      ${last
        ? (G.players.length >= 2 ? `<button class="btn big plum pulse" data-act="secret-start">💌 Gizli İyilik Kartları</button>` : `<button class="btn big" data-act="end">Geceyi bitir</button>`)
        : `<button class="btn big" data-act="deep" data-arg="${step + 1}">Sonraki ▶</button>`}
    </section>`, (step === 0 ? introText + " " : "") + s.say);
}

/* ============ GİZLİ İYİLİK ============ */
function derange(n) { let idx; do { idx = shuffle([...Array(n).keys()]); } while (idx.some((v, i) => v === i)); return idx; }
function secretStart() {
  const ps = G.players, to = derange(ps.length);
  G.secrets = ps.map((p, i) => {
    const lvl = ageOf(p.age).lvl, r = ps[to[i]];
    const deed = rnd(IYILIK.filter(d => d.min <= lvl)).d
      .replace(/\{X:in\}/g, ek(r.name, "in")).replace(/\{X:e\}/g, ek(r.name, "e")).replace(/\{X\}/g, r.name);
    return { from: p.name, fav: p.av, to: r.name, tav: r.av, deed, lvl };
  });
  screenSecret(0);
}
function screenSecret(i) {
  const s = G.secrets[i], line = `Telefonu ${ek(s.from, "e")} verin. Kimse bakmasın!`;
  render(`
    <section class="card game center" style="--c:var(--plum)">
      <span class="badge">💌 Gizli İyilik ${i + 1}/${G.secrets.length}</span>
      <div class="avatar-big">${s.fav}</div>
      <h2>${esc(line)}</h2>
      <div class="flip" id="flip">
        <div class="flip-inner" style="min-height:240px">
          <button class="side front" data-act="secret-flip" data-arg="${i}"><span class="q">💌</span><b>Dokun, zarfı aç</b></button>
          <div class="side back"><span class="mega" style="font-size:3.4rem">${s.tav}</span><span class="word" style="font-size:1.45rem">${esc(s.deed)}</span>${s.lvl === 0 ? `<small class="muted bold">Bir büyük sana fısıldasın.</small>` : ""}</div>
        </div>
      </div>
      <div id="sec-stage" class="stack" style="width:100%"></div>
    </section>`, line);
}
function secretFlip(i) {
  const f = document.getElementById("flip"); if (f.classList.contains("on")) return;
  f.classList.add("on"); sfx.flip();
  document.getElementById("sec-stage").innerHTML = `
    <p class="muted small bold">İyiliği gizli yapmak, onu sadece Allah rızası için yapmaktır. Bir hafta boyunca fark ettirme!</p>
    <button class="btn big plum" data-act="secret-hide" data-arg="${i}">Ezberledim, gizle 🤐</button>`;
}
function secretHide(i) {
  if (i + 1 < G.secrets.length) screenSecret(i + 1);
  else { lastSecrets = G.secrets; store.set("secrets", lastSecrets); screenEnd(); }
}

function screenEnd() {
  const f = G ? G.fidan : 0;
  const msg = `Maşallah, ne güzel bir geceydi! Bu gece ${f} fidan diktiniz.`;
  render(`
    <section class="card center">
      <span class="mega bounce" style="font-size:7rem">🌳</span>
      ${guide(msg, { noSpeak: true })}
      <p class="big-text" style="font-size:1.3rem">Bahçemizde toplam ${gardenTotal} fidan var!</p>
      ${lastSecrets ? `<p class="muted small bold">Bir sonraki oyun gecesinde ana sayfadan “Gizli İyilik Tahmini”ni açın.</p>` : ""}
      <button class="btn big" data-act="home">Ana sayfa 🏠</button>
    </section>`, msg);
  confetti(34); sfx.win(); later(happy, 300);
  G = null;
}

/* ============ TAHMİN TURU ============ */
function screenGuess(i, shown) {
  const s = lastSecrets[i];
  const q = `${s.to}, bu hafta sana kim gizli iyilik yaptı?`;
  render(`
    <section class="card game center" style="--c:var(--plum)">
      <span class="badge">🕵️ Tahmin ${i + 1}/${lastSecrets.length}</span>
      <div class="avatar-big">${s.tav}</div>
      <h2>${esc(q)}</h2>
      ${shown
        ? `<span class="mega bounce" style="font-size:4.5rem">${s.fav}</span>
           <div class="stamp" style="--c:var(--plum)">${esc(s.from)}!</div>
           <p class="bold">${esc(s.deed)}</p>
           <p class="muted bold">${esc(s.to)}, teşekkür etmeyi unutma! 🤗</p>
           <button class="btn big" data-act="guess-next" data-arg="${i}">${i + 1 < lastSecrets.length ? "Sıradaki ▶" : "Tahmin turu bitti 🎉"}</button>`
        : `<p class="muted bold">Herkes tahminini söylesin!</p>
           <button class="btn big plum pulse" data-act="guess-show" data-arg="${i}">Cevabı göster 🥁</button>`}
    </section>`, shown ? `${s.from}! Görevi şuydu: ${s.deed}` : q);
  if (shown) { sfx.win(); confetti(16); }
}

/* ============ OLAYLAR ============ */
const actions = {
  home: screenHome,
  setup: screenSetup,
  say: t => say(t),
  sound() { soundOn = !soundOn; store.set("sound", soundOn); if (!soundOn) stopDrum(); updToggles(); },
  voice() { voiceOn = !voiceOn; store.set("voice", voiceOn); if (!voiceOn) hush(); else say("Sesli anlatım açık."); updToggles(); },
  count(d) {
    d = +d;
    if (d > 0 && family.length < 8) family.push({ name: "", age: "c", av: AVATARS[family.length % AVATARS.length] });
    if (d < 0 && family.length > 1) family.pop();
    store.set("family", family); sfx.pop(); screenSetup();
  },
  avatar(i, el) {
    const p = family[+i]; p.av = AVATARS[(AVATARS.indexOf(p.av) + 1) % AVATARS.length];
    el.innerHTML = `<span>${p.av}</span>`; store.set("family", family); sfx.pop();
  },
  themes() {
    family.forEach(p => p.name = p.name.trim());
    if (family.some(p => !p.name)) { document.getElementById("setup-err").hidden = false; sfx.no(); return; }
    store.set("family", family); screenThemes();
  },
  start: startGame,
  turn: screenTurn,
  spin,
  play,
  next: nextTurn,
  finish: () => screenDeep(0),
  flip: flipCard,
  "act-go": actGo,
  "act-done": a => actDone(a === "1"),
  answer: a => answer(+a),
  best: a => best(+a),
  "count-up": countUp,
  "kalk-show": () => kalkStep(true),
  "kalk-next": a => kalkNext(a === "1"),
  "hay-go": hayGo,
  "hay-next": hayNext,
  "sas-go": sasGo,
  caught,
  "sas-done": sasDone,
  hoca: a => hoca(a === "1"),
  deep: a => screenDeep(+a),
  "secret-start": secretStart,
  "secret-flip": a => secretFlip(+a),
  "secret-hide": a => secretHide(+a),
  end: screenEnd,
  guess: a => screenGuess(+a, false),
  "guess-show": a => screenGuess(+a, true),
  "guess-next": a => {
    a = +a;
    if (a + 1 < lastSecrets.length) screenGuess(a + 1, false);
    else { lastSecrets = null; store.set("secrets", null); confetti(); screenHome(); }
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  audio();
  const fn = actions[b.dataset.act];
  if (fn) fn(b.dataset.arg, b);
});
$app.addEventListener("input", e => {
  const el = e.target; if (!el.dataset.field) return;
  family[+el.dataset.i][el.dataset.field] = el.value;
  store.set("family", family);
});
function updToggles() {
  const s = document.getElementById("snd"), v = document.getElementById("voice");
  s.textContent = soundOn ? "🔊" : "🔇"; s.classList.toggle("off", !soundOn);
  v.classList.toggle("off", !voiceOn || !tts.ok);
  if (!tts.ok) v.title = "Bu cihaz sesli anlatımı desteklemiyor";
}

updToggles();
renderGarden();
screenHome();
</script>
