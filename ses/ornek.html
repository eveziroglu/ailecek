<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hüdhüd Ses Örnekleri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../yazi/yazi.css">
<style>
:root { --bg: #f4f6fb; --card: #ffffff; --ink: #18204a; --muted: #525d88; --line: #d3dcec; --cini: #2747b5; --kandil: #eaa214; --on: #ffffff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1430; --card: #1a2148; --ink: #eef1fb; --muted: #a9b2d8; --line: #343e74; --cini: #86a2ff; --kandil: #ffc54d; --on: #0f1430; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0f1430; --card: #1a2148; --ink: #eef1fb; --muted: #a9b2d8; --line: #343e74; --cini: #86a2ff; --kandil: #ffc54d; --on: #0f1430; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.5 Figtree, system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font: 700 30px/1.1 "Baloo 2", system-ui, sans-serif; margin: 0; }
h2 { font: 700 22px/1.1 "Baloo 2", system-ui, sans-serif; margin: 0; color: var(--cini); }
.lead { color: var(--muted); margin: 0; }
.voice { background: var(--card); border-radius: 24px; padding: 18px; box-shadow: 0 5px 0 var(--line); display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.row p { margin: 0; font-weight: 600; }
button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--kandil); color: #1d1a0e; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 color-mix(in srgb, var(--kandil) 60%, #000); }
button.playing { background: var(--cini); color: var(--on); }
button:focus-visible { outline: 3px solid var(--cini); outline-offset: 3px; }
.empty { background: var(--card); border-radius: 24px; padding: 18px; color: var(--muted); }
</style>
<main>
  <h1>Hüdhüd Ses Örnekleri</h1>
  <p class="lead">Aynı cümleler iki farklı yapay zekâ servisiyle seslendirildi. Dinleyin ve Hüdhüd'e en çok yakışan sesi seçin.</p>
  <div id="list"><div class="empty">Örnekler yükleniyor…</div></div>
</main>
<script>
let current = null;
fetch("ornek.json").then(r => r.ok ? r.json() : []).catch(() => []).then(list => {
  const el = document.getElementById("list");
  if (!list.length) { el.innerHTML = '<div class="empty">Henüz örnek üretilmedi.</div>'; return; }
  el.innerHTML = list.map(v => `<section class="voice"><h2>${v.etiket}</h2>${v.dosyalar.map(d => `<div class="row"><button data-src="ornek/${d.f}" aria-label="Dinle">▶</button><p>${d.m}</p></div>`).join("")}</section>`).join("");
  el.style.display = "flex"; el.style.flexDirection = "column"; el.style.gap = "16px";
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-src]"); if (!b) return;
  if (current) { current.a.pause(); current.b.classList.remove("playing"); current.b.textContent = "▶"; if (current.b === b) { current = null; return; } }
  const a = new Audio(b.dataset.src); current = { a, b };
  b.classList.add("playing"); b.textContent = "■";
  a.onended = () => { b.classList.remove("playing"); b.textContent = "▶"; current = null; };
  a.play().catch(() => {});
});
</script>
